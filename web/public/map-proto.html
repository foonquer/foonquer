<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>지도 시안 · 우리 핀만</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: Pretendard, system-ui, sans-serif; background: #f1f4ee; }
  #map { position: absolute; inset: 0; }
  .bar { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { padding: 6px 12px; border-radius: 16px; background: #fff; box-shadow: 0 3px 8px rgba(33,61,41,.12); font-size: 13px; font-weight: 700; color: #2f5d3d; }
  .note { padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,.9); font-size: 11px; color: #6b7468; }
  .pin { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .pin img { width: 34px; height: 40px; filter: drop-shadow(0 4px 6px rgba(33,61,41,.12)); }
  .pin span { margin-top: 2px; padding: 1px 6px; border-radius: 6px; background: #fff; font-size: 11px; color: #242824; white-space: nowrap; max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); cursor: pointer; }
  .me { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .me img { width: 60px; }
  .me .shadow { width: 44px; height: 11px; margin-top: -9px; border-radius: 50%; background: rgba(33,61,41,.18); }
  .me .label { margin-top: 2px; padding: 3px 9px; border-radius: 10px; background: #2f5d3d; color: #fff; font-size: 11px; font-weight: 700; }
  .sheet { position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 2; padding: 14px 16px; border-radius: 18px; background: #fff; box-shadow: 0 6px 18px rgba(33,61,41,.18); font-size: 14px; display: none; }
  .sheet strong { display: block; font-size: 17px; margin-bottom: 4px; }
  .maplibregl-ctrl-attrib { font-size: 10px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <span class="chip">강서구 · 가양동</span>
  <button class="chip" id="toggle" type="button">다른 장소 끄기</button>
  <span class="note">시안: 음식점·카페 아이콘만 끄고 우리 핀으로 · 역·학교·병원 같은 다른 장소는 남김 · 핀 위치는 OpenStreetMap 음식점 예시</span>
</div>
<div class="sheet" id="sheet"></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

g9IjE1IiBmaWxsPSJ3aGl0ZSIvPgo8cGF0aCBkPSJNMzIgNTFINDRMMzggNjNMMzIgNTFaIiBmaWxsPSJ3aGl0ZSIvPgo8cmVjdCB4PSIyNiIgeT0iMzAiIHdpZHRoPSIyNCIgaGVpZ2h0PSIxOCIgcng9IjQiIGZpbGw9IiNGRkYxRDkiLz4KPHJlY3QgeD0iMjMiIHk9IjIxIiB3aWR0aD0iMzAiIGhlaWdodD0iMTIiIHJ4PSI0IiBmaWxsPSIjNTlBODY0Ii8+CjxyZWN0IHg9IjM1IiB5PSIzNyIgd2lkdGg9IjciIGhlaWdodD0iMTEiIHJ4PSIyIiBmaWxsPSIjNTlBODY0Ii8+CjxjaXJjbGUgY3g9IjU0LjUiIGN5PSIxOS41IiByPSI4LjUiIGZpbGw9IiM1OUE4NjQiLz4KPHBhdGggZD0iTTUwLjcwODQgMTkuNUw1Mi44NzUgMjEuNjY2N0w1OC4yOTE3IDE2LjI1IiBzdHJva2U9IndoaXRlIiBzdHJva2Utd2lkdGg9IjAuOTc1IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KPC9zdmc+Cg==';
const CENTER = [126.8545, 37.5617];
const poiLayers = [];
let othersOn = true;
const FOOD = ['restaurant', 'cafe', 'fast_food', 'bar', 'pub', 'ice_cream', 'bakery', 'food_court'];
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron',
  center: CENTER,
  zoom: 16.2,
  attributionControl: { compact: true },
});
map.on('load', () => {
  for (const layer of map.getStyle().layers) {
    const id = layer.id;
    // 1) 바탕 지도의 음식점·카페 아이콘과 이름만 끈다 (우리 핀과 겹치지 않게). 역·학교 등은 길 찾기에 남긴다
    if (/^poi/.test(id)) {
      const base = layer.filter;
      const notFood = ['!', ['any', ['in', ['get', 'class'], ['literal', FOOD]], ['in', ['get', 'subclass'], ['literal', FOOD]]]];
      map.setFilter(id, base ? ['all', base, notFood] : notFood);
      poiLayers.push(id);
    }
    // 2) 이름은 한국어로
    if (layer.type === 'symbol' && layer.layout && layer.layout['text-field']) {
      map.setLayoutProperty(id, 'text-field', ['coalesce', ['get', 'name:ko'], ['get', 'name']]);
    }
    // 3) 피그마 홈 색에 가깝게
    if (layer.type === 'background') map.setPaintProperty(id, 'background-color', '#f1f4ee');
    if (/water/.test(id) && layer.type === 'fill') map.setPaintProperty(id, 'fill-color', '#cfe3ee');
    if (/park|grass|wood|landcover|landuse/.test(id) && layer.type === 'fill') map.setPaintProperty(id, 'fill-color', '#dcebd7');
    if (/building/.test(id) && layer.type === 'fill') { map.setPaintProperty(id, 'fill-color', '#e4e9df'); }
  }
  // 내 위치 먹깨비
  const me = document.createElement('div');
  me.className = 'me';
  me.innerHTML = `<img src="${MK}" alt=""><span class="shadow"></span><span class="label">내 먹깨비</span>`;
  new maplibregl.Marker({ element: me, anchor: 'bottom', offset: [0, 22] }).setLngLat([126.8531, 37.5609]).addTo(map);
  draw();
});

let markers = [];
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function draw() {
  markers.forEach((m) => m.remove());
  markers = [];
  const seen = new Set();
  const feats = map.querySourceFeatures('openmaptiles', { sourceLayer: 'poi' })
    .filter((f) => FOOD.includes(f.properties.class) || FOOD.includes(f.properties.subclass));
  const zoom = map.getZoom();
  for (const f of feats) {
    const name = f.properties['name:ko'] || f.properties.name;
    if (!name || f.geometry.type !== 'Point') continue;
    const key = name + f.geometry.coordinates.map((v) => v.toFixed(5)).join(',');
    if (seen.has(key)) continue;
    seen.add(key);
    const conquered = hash(name) % 6 === 0;
    let el;
    if (zoom >= 16.5) {
      el = document.createElement('div');
      el.className = 'pin';
      el.innerHTML = `<img src="${conquered ? PIN_C : PIN_U}" alt=""><span></span>`;
      el.querySelector('span').textContent = name;
    } else {
      el = document.createElement('div');
      el.className = 'dot';
      el.style.background = conquered ? '#2f5d3d' : '#ea7b66';
    }
    el.addEventListener('click', (e) => { e.stopPropagation(); show(name, conquered); });
    markers.push(new maplibregl.Marker({ element: el, anchor: zoom >= 16.5 ? 'top' : 'center', offset: zoom >= 16.5 ? [0, -40] : [0, 0] })
      .setLngLat(f.geometry.coordinates).addTo(map));
    if (markers.length >= 250) break;
  }
}
function show(name, conquered) {
  const s = document.getElementById('sheet');
  s.innerHTML = `<strong></strong>${conquered ? '정복 완료' : '미정복'} · 누른 핀의 가게만 열려요`;
  s.querySelector('strong').textContent = name;
  s.style.display = 'block';
}
map.on('click', () => { document.getElementById('sheet').style.display = 'none'; });
document.getElementById('toggle').addEventListener('click', (e) => {
  othersOn = !othersOn;
  poiLayers.forEach((id) => map.setLayoutProperty(id, 'visibility', othersOn ? 'visible' : 'none'));
  e.currentTarget.textContent = othersOn ? '다른 장소 끄기' : '다른 장소 켜기';
});
map.on('idle', draw);
</script>
