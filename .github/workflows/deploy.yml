name: Deploy

# develop에 서버 관련 파일이 올라오면 서버를 배포한다 (README 배포).
# 이미지 빌드 → GHCR(ghcr.io/foonquer/foonquer-server) → IAP로 VM에 SSH → scripts/deploy-remote.sh
# 웹(web/)은 Vercel이 따로 배포한다.
on:
  push:
    branches: [develop]
    paths:
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'scripts/deploy-remote.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# 배포가 겹치면 앞의 것을 끝까지 하고 다음 것을 한다 (마이그레이션 도중에 끊지 않는다)
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/foonquer/foonquer-server

jobs:
  deploy:
    name: Build · Deploy
    runs-on: ubuntu-latest
    # GCP 준비 전(변수 없음)에는 돌지 않는다
    if: vars.GCE_INSTANCE != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy on VM
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # VM에 둘 파일(저장소가 비공개라 VM은 clone하지 않는다)을 묶는다
          BUNDLE=$(tar czf - docker-compose.yml deploy scripts/backup-db.sh | base64 -w0)
          # deploy-remote.sh의 플레이스홀더에 이번 실행의 GHCR 로그인 값과 파일 묶음을 채운다 (GITHUB_TOKEN은 이 실행이 끝나면 무효)
          sed -e "s|__GHCR_ACTOR__|${GHCR_ACTOR}|g" -e "s|__GHCR_TOKEN__|${GHCR_TOKEN}|g" \
            -e "s|__BUNDLE__|${BUNDLE}|" \
            scripts/deploy-remote.sh > "$RUNNER_TEMP/deploy.sh"
          gcloud compute ssh "${{ vars.GCE_INSTANCE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --zone "${{ vars.GCE_ZONE }}" \
            --tunnel-through-iap \
            --quiet \
            --strict-host-key-checking=no \
            --command 'bash -s' < "$RUNNER_TEMP/deploy.sh"

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.API_DOMAIN }}/api/v1/health"; then exit 0; fi
            sleep 6
          done
          echo "health check failed" >&2
          exit 1
